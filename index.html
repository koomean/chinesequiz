<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ติวจีน บท 3–4 | Quiz</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--text:#182033;--muted:#667085;--accent:#4f46e5;--ok:#15803d;--bad:#b42318;--border:#e5e7eb}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,"Noto Sans Thai",sans-serif;background:var(--bg);color:var(--text)}
.wrap{max-width:900px;margin:auto;padding:24px}h1{font-size:clamp(25px,5vw,38px);margin:0 0 8px}.sub{color:var(--muted);line-height:1.6}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}.btn{font:inherit;border:1px solid var(--border);background:#fff;border-radius:12px;padding:10px 14px;cursor:pointer}.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.status{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin:12px 0}.pill{padding:7px 10px;border-radius:999px;background:#fff;border:1px solid var(--border);font-size:14px}
.card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:24px;box-shadow:0 10px 30px rgba(16,24,40,.06)}.mode{color:var(--accent);font-weight:700;font-size:14px;margin-bottom:8px}.q{font-size:clamp(26px,6vw,42px);font-weight:800;margin:8px 0;line-height:1.25}.py{color:var(--muted);font-size:16px;margin-bottom:18px}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px}.choice{text-align:left;border:1px solid var(--border);background:#fff;border-radius:14px;padding:16px;cursor:pointer;min-height:64px}.choice:hover{border-color:#a5b4fc}.choice.correct{border-color:#86efac;background:#f0fdf4}.choice.wrong{border-color:#fca5a5;background:#fef2f2}
.feedback{margin-top:16px;padding:14px;border-radius:12px;display:none;line-height:1.6}.feedback.show{display:block}.feedback.ok{background:#f0fdf4;color:var(--ok)}.feedback.no{background:#fef2f2;color:var(--bad)}.next{margin-top:16px;width:100%;display:none}.next.show{display:block}
.result{display:none;text-align:center}.result.show{display:block}.bigscore{font-size:48px;font-weight:900;margin:10px 0}.footer{margin-top:16px;color:var(--muted);font-size:13px;line-height:1.6}
@media(max-width:650px){.choices{grid-template-columns:1fr}.card{padding:18px}}
</style></head>
<body><div class="wrap">
<h1>🧠 ตะลุยข้อสอบจีน บท 3–4</h1>
<div class="sub">สลับรูปแบบอัตโนมัติ: <b>ไทย → เลือกจีน</b> แล้ว <b>จีน → เลือกไทย</b> ไปทีละข้อ พร้อมเฉลยและคะแนน</div>
<div class="toolbar"><button class="btn primary" onclick="start(20)">เริ่ม 20 ข้อ</button><button class="btn" onclick="start(BANK.length)">เล่นครบทุกคำ</button><button class="btn" onclick="start(modeCount)">สุ่มใหม่</button></div>
<div id="status" class="status" style="display:none"><span class="pill" id="counter"></span><span class="pill" id="score"></span><span class="pill" id="streak"></span></div>
<section id="quiz" class="card" style="display:none"><div id="mode" class="mode"></div><div id="question" class="q"></div><div id="promptPy" class="py"></div><div id="choices" class="choices"></div><div id="feedback" class="feedback"></div><button id="next" class="btn primary next">ข้อถัดไป →</button></section>
<section id="result" class="card result"><div class="mode">จบแล้ว 🎉</div><div id="finalScore" class="bigscore"></div><div id="finalText"></div><button class="btn primary" style="margin-top:18px" onclick="start(modeCount)">เล่นอีกครั้ง</button></section>
<div class="footer">อิงคำศัพท์และรูปแบบโจทย์จากไฟล์บท 3–4 และตัวอย่างข้อสอบที่ส่งมา เช่น 会, 游泳, 运动, 打, 足球, 羽毛球, 想, 不想, 吃, 喝, 饼干, 口渴, 甜的, 辣的, 酸的, 苦的, 油腻的 และ 的</div>
</div>
<script>
const V=[
['会','huì','เป็น / สามารถ'],['游泳','yóuyǒng','ว่ายน้ำ'],['一点儿','yìdiǎnr','นิดหน่อย'],['也','yě','ก็ / ด้วย'],['那','nà','งั้น / ถ้างั้น'],['运动','yùndòng','กีฬา'],['打','dǎ','เล่น / ตี'],['篮球','lánqiú','บาสเกตบอล'],['网球','wǎngqiú','เทนนิส'],['棒球','bàngqiú','เบสบอล'],['排球','páiqiú','วอลเลย์บอล'],['足球','zúqiú','ฟุตบอล'],['乒乓球','pīngpāng qiú','ปิงปอง'],['羽毛球','yǔmáoqiú','แบดมินตัน'],['滑雪','huáxuě','เล่นสกี'],['滑冰','huábīng','เล่นสเกตน้ำแข็ง'],['开车','kāichē','ขับรถ'],['做菜','zuò cài','ทำอาหาร'],['弹钢琴','tán gāngqín','เล่นเปียโน'],['日语','rìyǔ','ภาษาญี่ปุ่น'],['跳','tiào','กระโดด / เต้น'],['芭蕾舞','bālěiwǔ','บัลเลต์'],['好吃','hǎochī','อร่อย'],['知道','zhīdào','รู้'],
['想','xiǎng','อยาก'],['不想','bù xiǎng','ไม่อยาก'],['吃','chī','กิน'],['喝','hē','ดื่ม'],['可乐','kělè','โคล่า'],['饼干','bǐnggān','คุกกี้'],['牛奶','niúnǎi','นม'],['看电影','kàn diànyǐng','ดูหนัง'],['听音乐','tīng yīnyuè','ฟังเพลง'],['口渴','kǒu kě','กระหายน้ำ'],['甜的','tián de','ของหวาน / สิ่งที่หวาน'],['辣的','là de','ของเผ็ด'],['酸的','suān de','ของเปรี้ยว'],['苦的','kǔ de','ของขม'],['油腻的','yóunì de','ของมัน / เลี่ยน'],['的','de','ของ... / แสดงความเป็นเจ้าของ']
].map(x=>({zh:x[0],py:x[1],th:x[2]}));
const P=[
['打篮球','dǎ lánqiú','เล่นบาสเกตบอล'],['打网球','dǎ wǎngqiú','เล่นเทนนิส'],['打棒球','dǎ bàngqiú','เล่นเบสบอล'],['打排球','dǎ páiqiú','เล่นวอลเลย์บอล'],['打乒乓球','dǎ pīngpāng qiú','เล่นปิงปอง'],['打羽毛球','dǎ yǔmáoqiú','เล่นแบดมินตัน'],['踢足球','tī zúqiú','เล่นฟุตบอล'],['弹钢琴','tán gāngqín','เล่นเปียโน'],['跳芭蕾舞','tiào bālěiwǔ','เต้นบัลเลต์'],['一点儿也不会','yìdiǎnr yě bú huì','ไม่เป็นเลย'],['一点儿也不知道','yìdiǎnr yě bù zhīdào','ไม่รู้เลย'],['一点儿也不好吃','yìdiǎnr yě bù hǎochī','ไม่อร่อยเลย'],['你会不会游泳？','Nǐ huì bú huì yóuyǒng?','คุณว่ายน้ำเป็นไหม?'],['你会游泳吗？','Nǐ huì yóuyǒng ma?','คุณว่ายน้ำเป็นไหม?'],['那你会什么运动？','Nà nǐ huì shénme yùndòng?','งั้นคุณเล่นกีฬาอะไรเป็น?'],['我会打篮球。','Wǒ huì dǎ lánqiú.','ฉันเล่นบาสเป็น'],['我想喝可乐。','Wǒ xiǎng hē kělè.','ฉันอยากดื่มโคล่า'],['我想喝牛奶。','Wǒ xiǎng hē niúnǎi.','ฉันอยากดื่มนม'],['我想听音乐。','Wǒ xiǎng tīng yīnyuè.','ฉันอยากฟังเพลง'],['我不想吃饼干。','Wǒ bù xiǎng chī bǐnggān.','ฉันไม่อยากกินคุกกี้'],['我不想吃甜的。','Wǒ bù xiǎng chī tián de.','ฉันไม่อยากกินของหวาน'],['这是谁的？','Zhè shì shéi de?','นี่คือของใคร?'],['这是我的。','Zhè shì wǒ de.','นี่คือของฉัน'],['这是我妈妈的。','Zhè shì wǒ māma de.','นี่คือของแม่ฉัน']
].map(x=>({zh:x[0],py:x[1],th:x[2]}));
const BANK=[...V,...P]; let qs=[],idx=0,score=0,streak=0,answered=false,modeCount=20;
function sh(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function build(n){const base=sh(BANK).slice(0,Math.min(n,BANK.length));qs=base.map((it,i)=>{let dir=i%2===0?'th-zh':'zh-th';let ds=sh(BANK.filter(x=>x.zh!==it.zh)).slice(0,3);let opts=sh([it,...ds]);return{it,dir,opts}})}
function start(n){modeCount=n;idx=0;score=0;streak=0;answered=false;build(n);document.getElementById('status').style.display='flex';document.getElementById('quiz').style.display='block';document.getElementById('result').classList.remove('show');render()}
function render(){const q=qs[idx];answered=false;document.getElementById('counter').textContent=`ข้อ ${idx+1} / ${qs.length}`;document.getElementById('score').textContent=`คะแนน ${score}`;document.getElementById('streak').textContent=`🔥 ${streak}`;document.getElementById('mode').textContent=q.dir==='th-zh'?'ไทย → เลือกภาษาจีน':'จีน → เลือกภาษาไทย';document.getElementById('question').textContent=q.dir==='th-zh'?q.it.th:q.it.zh;document.getElementById('promptPy').textContent=q.dir==='th-zh'?'เลือกคำภาษาจีนที่ตรงกับความหมาย':`Pinyin: ${q.it.py}`;const box=document.getElementById('choices');box.innerHTML='';q.opts.forEach(o=>{const b=document.createElement('button');b.className='choice';b.innerHTML=q.dir==='th-zh'?`<div style="font-size:20px;font-weight:800">${o.zh}</div><div style="color:#667085;font-size:13px">${o.py}</div>`:`<div style="font-size:17px;font-weight:700">${o.th}</div>`;b.onclick=()=>choose(b,o.zh===q.it.zh,q.it,q.dir);box.appendChild(b)});const f=document.getElementById('feedback');f.className='feedback';f.innerHTML='';const nxt=document.getElementById('next');nxt.className='btn primary next';nxt.textContent=idx===qs.length-1?'ดูผลคะแนน':'ข้อถัดไป →'}
function choose(btn,ok,it,dir){if(answered)return;answered=true;document.querySelectorAll('.choice').forEach(x=>x.disabled=true);if(ok){btn.classList.add('correct');score++;streak++;show(true,`✅ ถูกต้อง! <b>${it.zh}</b> — <b>${it.py}</b> — ${it.th}`)}else{btn.classList.add('wrong');streak=0;document.querySelectorAll('.choice').forEach(x=>{let t=x.innerText.trim();if((dir==='th-zh'&&t.startsWith(it.zh))||(dir==='zh-th'&&t===it.th))x.classList.add('correct')});show(false,`❌ คำตอบคือ <b>${it.zh}</b> (<b>${it.py}</b>) = ${it.th}`)}document.getElementById('score').textContent=`คะแนน ${score}`;document.getElementById('streak').textContent=`🔥 ${streak}`;document.getElementById('next').className='btn primary next show'}
function show(ok,html){const f=document.getElementById('feedback');f.className='feedback show '+(ok?'ok':'no');f.innerHTML=html}
document.getElementById('next').onclick=()=>{idx++;if(idx>=qs.length)finish();else render()}
function finish(){document.getElementById('quiz').style.display='none';document.getElementById('status').style.display='none';document.getElementById('result').classList.add('show');let p=Math.round(score/qs.length*100);document.getElementById('finalScore').textContent=`${score} / ${qs.length}`;document.getElementById('finalText').textContent=p>=90?'โหดมาก 🔥':p>=75?'ดีมาก 👍':p>=60?'ใช้ได้ 💪':'ลองอีกสักรอบ จะจำได้แม่นขึ้น 🧠'}
start(20);
</script></body></html>
